[project]
name = "qubics-py"
version = "0.0.1"
dependencies = [
  "pygame>=2.5.0",
  "imageio[ffmpeg]",
  "watchdog",
  "pyobjc-framework-Metal",
  "pyobjc-framework-MetalKit",
  "pyobjc-framework-Cocoa"
]
requires-python = ">=3.12"

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = ["build", "dist", ".venv", "__pycache__"]

